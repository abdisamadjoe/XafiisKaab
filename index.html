<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xafiis Kaab — Opening soon</title>
  <meta name="description" content="Xafiis Kaab is opening soon.">
  <meta name="theme-color" content="#06142A">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500&f[]=satoshi@400,500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          // Navy carries the surfaces, orange is reserved for accents.
          colors: {
            night: '#06142A',  // page background
            navy: '#0B3A6B',   // brand navy, photo tint
            paper: '#F2F4F7',  // primary text
            mist: '#A7B8CC',   // secondary text
            orange: '#F26B0F', // brand accent: curves, dots
            ember: '#FF9450',  // accent text on dark
          },
          fontFamily: {
            display: ['"Clash Display"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            sans: ['Satoshi', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    /* The stage redraws the logo at page scale: photo in the navy panel, crossing curves and dots in orange. */
    .panel { clip-path: url(#panel); }
    .curve { stroke-width: 8px; }
    @media (min-width: 1024px) { .curve { stroke-width: 14px; } }

    .dot { position: absolute; border-radius: 9999px; background: #F26B0F; transform: translate(-50%, -50%); }

    @media (prefers-reduced-motion: no-preference) {
      .panel { animation: fade 1.2s ease-out both; }
      .curve { animation: fade .8s .5s ease-out both; }
      .dot { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(1.1s + var(--i) * 70ms); }
      @keyframes fade { from { opacity: 0; } }
      @keyframes pop { from { transform: translate(-50%, -50%) scale(0); } }
    }
  </style>
</head>
<body class="bg-night font-sans text-paper antialiased">
  <svg width="0" height="0" class="absolute" aria-hidden="true">
    <clipPath id="panel" clipPathUnits="objectBoundingBox">
      <path d="M0.176 0H0.715V0.158A0.125 0.168 0 0 0 0.84 0.326H1V0.74C0.78 0.74 0.586 0.77 0.4375 0.83C0.28 0.68 0.195 0.42 0.176 0Z"/>
    </clipPath>
  </svg>

  <main class="flex min-h-[100svh] flex-col">
    <div class="relative min-h-[54svh] flex-1 overflow-hidden lg:min-h-[58svh]">
      <div class="panel absolute inset-0 bg-navy">
        <img
          src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=2000&q=80"
          alt="A bright, open office with glass meeting rooms"
          class="h-full w-full object-cover saturate-[.8]">
        <div class="absolute inset-0 bg-navy/30 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-night/80 via-transparent to-transparent"></div>
      </div>

      <svg class="absolute inset-0 h-full w-full" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke="#F26B0F" stroke-linecap="round">
          <path class="curve" vector-effect="non-scaling-stroke" d="M17.6 -5C19.5 42 28 68 43.75 83C54.7 92.6 78 88.4 104 87.4"/>
          <path class="curve" vector-effect="non-scaling-stroke" d="M-4 93.7C15.6 90.5 31 88.4 43.75 83C58.6 77 78 74 104 74"/>
        </g>
      </svg>

      <div class="pointer-events-none absolute inset-0" aria-hidden="true">
        <span class="dot" style="--i:0; left:66.4%; top:4.2%;  width:clamp(8px,1.1vw,16px);  height:clamp(8px,1.1vw,16px)"></span>
        <span class="dot" style="--i:1; left:56.6%; top:13.2%; width:clamp(5px,.6vw,9px);    height:clamp(5px,.6vw,9px)"></span>
        <span class="dot" style="--i:2; left:61.7%; top:20%;   width:clamp(8px,1.1vw,16px);  height:clamp(8px,1.1vw,16px)"></span>
        <span class="dot" style="--i:3; left:51.2%; top:22.1%; width:clamp(4px,.45vw,7px);   height:clamp(4px,.45vw,7px)"></span>
        <span class="dot" style="--i:4; left:54.3%; top:28.9%; width:clamp(5px,.6vw,9px);    height:clamp(5px,.6vw,9px)"></span>
        <span class="dot" style="--i:5; left:59.4%; top:31.1%; width:clamp(6px,.85vw,12px);  height:clamp(6px,.85vw,12px)"></span>
        <span class="dot" style="--i:6; left:64.1%; top:38.9%; width:clamp(7px,.95vw,14px);  height:clamp(7px,.95vw,14px)"></span>
        <span class="dot" style="--i:7; left:78.1%; top:39.5%; width:clamp(18px,2.6vw,38px); height:clamp(18px,2.6vw,38px)"></span>
      </div>

      <a href="/" class="absolute left-4 top-4 rounded-[24%] focus:outline-none focus-visible:ring-[3px] focus-visible:ring-paper sm:left-8 sm:top-8 lg:left-12 lg:top-10">
        <img src="logo.svg" alt="Xafiis Kaab home" class="h-10 w-10 sm:h-14 sm:w-14">
      </a>
    </div>

    <section class="px-4 pb-8 pt-4 sm:px-8 lg:px-12 lg:pb-12">
      <div class="flex flex-col gap-8 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <h1 class="font-display text-[16vw] font-medium leading-[0.9] tracking-[-0.03em] text-paper lg:text-[11vw]">
            Xafiis Kaab
          </h1>
        </div>

        <p class="max-w-sm text-lg font-normal leading-[1.55] text-mist lg:pb-3 lg:text-xl">
          We're putting the finishing touches on the space. See you at the opening.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
